<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SINFON - Recorte de Fotos con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080c;--surface:#111118;--accent:#00d4ff;--text:#f0ece4;--muted:#6a6560}
body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;line-height:1.6}
.hero{text-align:center;padding:40px 16px 20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 40%,#001a2e 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,#0a0020 0%,transparent 50%)}
h1{font-family:'Bebas Neue',sans-serif;font-size:60px;letter-spacing:12px;color:var(--text);position:relative;z-index:1}
h1 span{color:var(--accent)}
.tagline{font-size:16px;color:var(--muted);position:relative;z-index:1}
.free-tag{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:6px;color:var(--accent);position:relative;z-index:1;margin-top:8px}
.features{display:flex;gap:12px;padding:20px 16px;justify-content:center}
.feature{background:var(--surface);border:1px solid #1a1a24;border-radius:12px;padding:16px;text-align:center;flex:1}
.feature h3{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--accent);margin-bottom:4px}
.feature p{font-size:11px;color:var(--muted)}
.space-frame{margin:20px 16px;border:2px solid #1a1a24;border-radius:16px;overflow:hidden;background:var(--surface)}
.space-frame iframe{width:100%;height:550px;border:none;display:block}
.comp-table{width:100%;margin:20px 16px;border-collapse:collapse}
.comp-table th,.comp-table td{padding:8px;text-align:center;border-bottom:1px solid #1a1a24;font-size:12px}
.comp-table th{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--accent)}
.comp-table td:first-child{text-align:left;font-weight:600}
.check{color:#4ade80}.cross{color:#ef4444}
footer{text-align:center;padding:20px 16px;color:var(--muted);font-size:11px;border-top:1px solid #1a1a24;margin-top:20px}
</style>
</head>
<body>

<section class="hero">
<h1>SIN<span>FON</span></h1>
<div class="tagline">Recorte de fotos con IA</div>
<div class="free-tag">GRATIS — SIN REGISTRO</div>
</section>

<div class="features">
<div class="feature"><h3>SIN APP</h3><p>Desde tu navegador</p></div>
<div class="feature"><h3>CON IA</h3><p>Recorte preciso</p></div>
<div class="feature"><h3>SIN LIMITE</h3><p>Para siempre</p></div>
</div>

<div class="space-frame">
<iframe src="https://neural-architect-dev-sinfon.hf.space" allow="camera"></iframe>
</div>

<table class="comp-table">
<tr><th></th><th>SINFON</th><th>remove.bg</th></tr>
<tr><td>Gratis</td><td class="check">&#10003;</td><td class="cross">$0.20/foto</td></tr>
<tr><td>Sin registro</td><td class="check">&#10003;</td><td class="cross">&#10007;</td></tr>
<tr><td>Sin marca</td><td class="check">&#10003;</td><td class="cross">&#10007;</td></tr>
<tr><td>Ilimitado</td><td class="check">&#10003;</td><td class="cross">&#10007;</td></tr>
</table>

<footer>SINFON — Hecho en Cuba</footer>
</body>
</html>
